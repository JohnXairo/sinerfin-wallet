---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sinerfin-wallet
  namespace: sinerfin
  labels:
    app: sinerfin-wallet
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sinerfin-wallet
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sinerfin-wallet
        version: "1.0"
      annotations:
        instana.io/service-name: "sinerfin-wallet"
    spec:
      # RHOS corre pods con usuario arbitrario — sin runAsUser fijo
      # el SCC restricted-v2 lo gestiona automaticamente
      containers:
        - name: wallet
          # Imagen del registry interno de RHOS (generada por BuildConfig)
          image: image-registry.openshift-image-registry.svc:5000/sinerfin/sinerfin-wallet:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: wallet-config
            - secretRef:
                name: wallet-secrets
          env:
            - name: INSTANA_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
