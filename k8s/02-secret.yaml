---
# INSTRUCCIONES:
# Generar los valores en base64:
#   echo -n "tu_valor" | base64
#
# O crear el secret directamente con kubectl:
#   kubectl create secret generic wallet-secrets \
#     --namespace sinerfin \
#     --from-literal=SECRET_KEY=$(openssl rand -hex 32) \
#     --from-literal=DATABASE_URL="postgresql://sinerfin:PASSWORD@192.168.1.192:5432/sinerfin_wallet"

apiVersion: v1
kind: Secret
metadata:
  name: wallet-secrets
  namespace: sinerfin
type: Opaque
stringData:
  # kubectl aplica base64 automaticamente con stringData
  SECRET_KEY:    "cambia-esto-genera-con-openssl-rand-hex-32"
  DATABASE_URL:  "postgresql://sinerfin:TU_PASSWORD@192.168.1.192:5432/sinerfin_wallet"
