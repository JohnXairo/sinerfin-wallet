---
apiVersion: v1
kind: Namespace
metadata:
  name: sinerfin
  labels:
    app.kubernetes.io/part-of: sinerfin

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-config
  namespace: sinerfin
data:
  SINERFIN_BASE_URL:        "http://192.168.1.190:8080/sinerfin2-1.0"
  REDIS_HOST:               "192.168.1.190"
  REDIS_PORT:               "6379"
  REDIS_DB:                 "1"
  REDIS_PASSWORD:           "SinergyPass2026."
  KAFKA_BOOTSTRAP_SERVERS:  "192.168.1.190:9092"
  DEBUG:                    "false"
  # Producción: reemplazar con dominio real, ej: '["http://wallet.sinergy.local"]'
  CORS_ORIGINS:             '["http://wallet.sinergy.local"]'
  # Instana — con Kubernetes Operator el agente corre como DaemonSet
  # El SDK usa el IP del nodo (spec.nodeName) automáticamente via downward API
  INSTANA_AGENT_PORT:       "42699"
  INSTANA_SERVICE_NAME:     "sinerfin-wallet"
  # IBM MQ — bus.sinergy.local (192.168.1.186) IBM MQ 10.0 LTS (REST API)
  MQ_HOST:                  "bus.sinergy.local"
  MQ_REST_PORT:             "9443"
  MQ_QUEUE_MANAGER:         "SINERFIN"
  MQ_QUEUE_RECARGA:         "SINERFIN.RECARGA.REQUEST"
