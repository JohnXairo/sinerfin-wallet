---
# Secret para OpenShift 4.22
# NO commitear con valores reales.
# Crear con oc:
#   oc create secret generic wallet-secrets \
#     --from-literal=SECRET_KEY=$(openssl rand -hex 32) \
#     --from-literal=DATABASE_URL="postgresql://sinerfin:PASS@192.168.1.192:5432/sinerfin_wallet" \
#     --from-literal=MQ_USER="" \
#     --from-literal=MQ_PASSWORD="" \
#     -n sinerfin
#
# O con este template (completar los valores antes de aplicar):
apiVersion: v1
kind: Secret
metadata:
  name: wallet-secrets
  namespace: sinerfin
  labels:
    app: sinerfin-wallet
type: Opaque
stringData:
  SECRET_KEY:   "REEMPLAZAR-con-openssl-rand-hex-32"
  DATABASE_URL: "postgresql://sinerfin:REEMPLAZAR@192.168.1.192:5432/sinerfin_wallet"
  MQ_USER:      ""
  MQ_PASSWORD:  ""
