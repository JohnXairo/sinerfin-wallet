---
# ╔══════════════════════════════════════════════════════════════╗
# ║  INSTRUCCIONES — ejecutar en el servidor k3s ANTES del deploy ║
# ╚══════════════════════════════════════════════════════════════╝
#
# OPCIÓN A (recomendada): crear el secret con kubectl directamente
# para que las credenciales NUNCA queden en un archivo versionado:
#
#   kubectl create namespace sinerfin --dry-run=client -o yaml | kubectl apply -f -
#
#   kubectl create secret generic wallet-secrets \
#     --namespace sinerfin \
#     --from-literal=SECRET_KEY=$(openssl rand -hex 32) \
#     --from-literal=DATABASE_URL="postgresql://sinerfin:TU_PASSWORD@192.168.1.192:5432/sinerfin_wallet" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# OPCIÓN B: editar este archivo con valores reales y aplicar.
#   ⚠️  NO hacer commit de este archivo con valores reales.
#   Agregar k8s/02-secret.yaml al .gitignore si usas esta opción.
#
#   Codificar en base64: echo -n "tu_valor" | base64

apiVersion: v1
kind: Secret
metadata:
  name: wallet-secrets
  namespace: sinerfin
type: Opaque
stringData:
  # kubectl aplica base64 automáticamente con stringData
  # Generar con: openssl rand -hex 32
  SECRET_KEY:   "REEMPLAZAR-con-openssl-rand-hex-32"
  DATABASE_URL: "postgresql://sinerfin:TU_PASSWORD@192.168.1.192:5432/sinerfin_wallet"
